spring.application.name=serviceforge-backend
server.port=8080

# CORS for the local Angular dev server
serviceforge.cors.allowed-origin=http://localhost:4200

# Log to file for diagnostics
logging.level.root=DEBUG
logging.file.name=logs/serviceforge.log

# Persistence
# serviceforge.persistence=memory|sqlite
serviceforge.persistence=${SERVICEFORGE_PERSISTENCE:sqlite}
serviceforge.sqlite-path=${SERVICEFORGE_SQLITE_PATH:backend/.data/serviceforge.db}
